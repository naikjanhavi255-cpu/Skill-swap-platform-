<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkillSwap Campus - Peer-to-Peer Skill Bank</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-white font-sans">
    <div class="min-h-screen flex flex-col items-center justify-center p-6 text-center">
        <span class="bg-cyan-500/10 text-cyan-400 text-xs font-semibold px-3 py-1 rounded-full mb-4 border border-cyan-500/20">🚀 Startup MVP</span>
        <h1 class="text-4xl md:text-6xl font-extrabold tracking-tight mb-4 bg-gradient-to-r from-cyan-400 to-purple-500 bg-clip-text text-transparent">
            SkillSwap Campus
        </h1>
        <p class="text-lg md:text-xl text-slate-400 max-w-2xl mb-8">
            "पैशाशिवाय चालणारी पहिली 'कौशल्य बँक' (Skill Bank), जिथे ज्ञान हेच चलन (Currency) आहे."
        </p>
        <div class="flex flex-wrap gap-4 justify-center">
            <button class="bg-cyan-500 hover:bg-cyan-600 text-slate-950 font-bold px-6 py-3 rounded-xl transition shadow-lg shadow-cyan-500/20">
                Explore Skills
            </button>
            <button class="bg-slate-900 hover:bg-slate-800 text-slate-200 border border-slate-800 font-semibold px-6 py-3 rounded-xl transition">
                Teach & Earn Credits
            </button>
        </div>
    </div>
</body>
</html>
